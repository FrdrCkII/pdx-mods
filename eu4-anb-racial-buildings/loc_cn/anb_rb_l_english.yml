l_english:
building_elven_building: "精灵林地保护区"
building_elven_building_desc: "自从伊奥蕾尔宣称红林地是精灵族的领地，她就在哈兰坎范围内开创了一个先例，即各国可以向精灵族提供受保护的林地，而英勇技艺高超的精灵族将在此定居并保护他们。"
building_halfling_building: "半身人村庄"
building_halfling_building_desc: "人们常说说半身人就像老鼠。如果你找到了一只，就意味着附近有一个他们的聚居地。我们可以建造合适的住所，带几个半身人来这个新村落吧，肯定有更多的半身人会来。"
building_dwarven_building: "矮人要塞"
building_dwarven_building_desc: "矮人是最好的工匠与建筑师，如果我们建造一座适合矮人居住的要塞，就很容易吸引一些矮人来这座城市居住，大大减少我们当地要塞的维护成本并提振当地经济。"
building_gnomish_building: "侏儒社区"
building_gnomish_building_desc: "他们说没有人能比侏儒更聪明。但与此同时，他们倾向于进行更多的、大多数地方不受认可的疯狂实验。如果我们建立一个研究和建筑法规非常宽松的社区，就很容易吸引一些少数族群来这里。"
building_orcish_building: "兽人格斗竞技场"
building_orcish_building_desc: "强权即公理，是兽人的荣誉准则。尽管这种哲学使构建一个适当的进步社会变得困难，但我们还是可以做出一些让步的。一个可以让各种性别和年龄的兽人自由决战的竞技场，这将帮助他们在这座城市定居下来。"
building_kobold_building: "狗头人地下城"
building_kobold_building_desc: "狗头人是一个地下种族，但他们几乎没有属于他们自己的地下。地表世界的既定王国和联盟使他们很难在主世界扩张。而蛇脊山脉众多的地精和兽人又使他们几乎不可能在地底扩张。因此，一些独立的氏族愿意在我们的城市定居，并将他们地下城扩展至地面以换取安全。"
building_half_orcish_building: "独立半兽人部落"
building_half_orcish_building_desc: "在绿潮之后，许多半兽人开始在哈兰的大地上行走。尽管他们可能和人类一样文明，但他们仍然保留着从兽人祖先那里继承来的氏族组织形式。如果我们保证重视氏族的完整性，一些氏族就愿意移民到这里。"
building_human_building: "人类街区"
building_human_building_desc: "人类出色的生殖力使其像地精一样几乎遍布哈兰每个已知的角落。如果我们承诺免费住房和一些最低限度的自治，他们就很容易被吸引来这个城市定居。"
building_gnollish_building: "豺狼人「公司城镇」"
building_gnollish_building_desc: "让别人做所有的工作，自己拿所有的东西，这是豺狼人的天性，但这并不意味着他们不能创新！坎诺人通过很多手段来维持对工人的控制，最令人印象深刻的是，他们说服工人，奴役是一种自由的形式。通过正式私有化奴隶市场，并宣布它们为「公司城镇」，豺狼人也可以解放他们的奴隶，同时仍然保持对奴隶们劳动几乎完全的控制。只需要用种植园内有效的货币支付薪资，奴隶们就别无选择，只能继续为他们工作。让我们采用这种制度，「解放」我们的臣民！"
building_ruinborn_building: "遗迹精灵展览馆"
building_ruinborn_building_desc: "这里展示了遗迹精灵准备的诸多先驱精灵遗物与埃兰提尔历史展品，在复兴遗迹精灵历史文化的同时也为饥渴的坎诺学者和法师们揭秘这片失落之地在灰烬天空前后的一切！如果出手足够阔绰又对探索先驱精灵秘密有足够的兴趣，你可以买下任何展品，包括临时客串展品的遗迹精灵导游。但这耗费的巨资会让最富裕的法师领主感到心疼……"
building_goblin_building: "地精洞穴系统"
building_goblin_building_desc: "这个世界上没有一个地方没有地精。你可能不经常看到他们，但他们总是在附近。我们可以和当地的一个地精地下帮派做个交易，我们漠视他们的壮大，作为交换，他们会支持我们的当地政府。"
building_harpy_building: "鹰身女妖妓院"
building_harpy_building_desc: "噢……我们为什么要强迫自己去煞费苦心,去四处寻找那些纤弱的种畜呢,明明只需要让他们看看我们更具风情的一面……就会主动给我们的……"
building_troll_building: "官方巨魔合约"
building_troll_building_desc: "与巨魔的怪异契约是一种全球现象。我们可以正式化这个合同制度，并要求他们维护我们的基础设施，以换取当地什一捐献的食物和亮闪闪的克朗。"
building_half_elven_building: "半精灵区"
building_half_elven_building_desc: "无论他们走到哪里，半精灵都受到皇室般的待遇，并总是遭到种族融合的冷落。如果我们在城外指定一个半精灵区，几乎可以肯定会有一些半精灵被吸引到那里。"
building_harimari_building: "虎人独栋区"
building_harimari_building_desc: "自从虎人崛起以来，他们就一直在努力寻找一个独立的、远离人类喧嚣的住所以进行哲学上的静思。如果我们提供宅邸和一些名义上的自由，我们很可能会吸引一些虎人来这里。"
building_hobgoblin_building: "大地精友好基建"
building_hobgoblin_building_desc: "大地精是所有种族中最多样化的。高，胖，矮，瘦，他们有各种各样的形状和大小。这使得他们很难找到适合他们的城市。如果我们重新设计城市的基础设施，让各种体型的大地精都可以使用，肯定会有一些大地精家庭搬到这里来。"
building_centaur_building: "半人马游牧地"
building_centaur_building_desc: "每当一位半人马赢得一场决斗，另一位半人马就会输掉他的一切。如果我们开放某些区域给半人马专用，那些被迫离开的失败者就会被吸引到这里。"
building_ogre_building: "饕餮盛宴"
building_ogre_building_desc: "听啊，都来听啊，在王国里传扬这个消息！一场盛大的自助饕餮盛宴即将举办。让每一个人都知道！这不是一场吸引野外贪婪的食人魔的伎俩，不是一个骗局！只要他们敢于前来，这里都欢迎他们！"
building_lizardfolk_building: "蜥蜴人狩猎场"
building_lizardfolk_building_desc: "蜥蜴人有着天生的坚硬鳞片与利爪，这决定了他们是天生的猎手。蜥蜴人不信任同胞，异族便更不用提。谁知道这里潜伏了多少猎物与猎手呢？密林下的阴影会掩饰一切的残忍与血腥。"
