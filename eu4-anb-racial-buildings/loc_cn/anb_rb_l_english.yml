anb_rb_recolony_title: "处理空置种族基建"
anb_rb_recolony_desc: "由于一些原因——无论是由于人口的迁徙还是由于我国种族政策的变化——总之，一些为特定种族建设的基础设施已被废弃。我们可以设立一些定居基金来吸引移民，或者拆除这些基建并收回一部分成本。\n§Y我们将花费50¤每个人口来使修正重新生效（当我们仍然拥有足够的容忍度时），或者移除该修正并获得50¤（当我们不再容忍这些种族时）。§!"
anb_rb_recolony_tt: "§Y我们将花费50¤每个人口来使修正重新生效（当我们仍然拥有足够的容忍度时），或者移除该修正并获得50¤（当我们不再容忍这些种族时）。§!"
