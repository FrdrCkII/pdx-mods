  ### 1.2 GUI ###

  ABS_resource_title: "Resources"
  ABS_resource_tt: "These figures reflect the resources required for automated construction. Under normal circumstances, all values should be 0; These numbers are only increased when stocks run low. If the inventory is sufficient, the next time automatic build is triggered, it will be paid. \n Click the buttons to pay then manually."
  ABS_pay_all_text: "Pay All"
  ABS_minerals_text: "£minerals£$minerals$: [root.ABS_minerals]"
  ABS_alloys_text: "£alloys£$alloys$: [root.ABS_alloys]"
  ABS_influence_text: "£influence£$influence$: [root.ABS_influence]"

  ABS_action_title: "Actions"
  ABS_action_tt: "The buttons can perform some immediate effects. Some §Bactions§! can be configured through §Bsub-options§! below the button."
  ABS_build_stations_text: "$BUILD$ $stations$"
  ABS_build_stations_tt: "§BAction§!\n$BUILD$ $station_gatherers$ and $station_researchers$ in every controlled $SYSTEMS$."
  ABS_build_starbases_text: "$BUILD$ $starbases$"
  ABS_build_starbases_tt: "§BAction§!\n$BUILD$ $starbases$ in every surveyed $SYSTEMS$.\nHas §BSub-options§!!"
  ABS_build_starbases_subject_text: "$subjects$"
  ABS_build_starbases_subject_tt: "§BSub-option§! of $ABS_build_starbases_text$\nIf enabled, allows $ABS_build_starbases_text$ in §Y$subjects$§! $SURVEYED$ $SYSTEMS$."
  ABS_build_starbases_fallen_text: "$personality_fallen_empire_xenophobe$"
  ABS_build_starbases_fallen_tt: "§BSub-option§! of $ABS_build_starbases_text$\nIf enabled, avoid enraging $personality_fallen_empire_xenophobe$ when $ABS_build_starbases_text$."

  ABS_auto_build_starbases_text: "$AUTO_GENERATED_STANDARD$ $BUILD$ $starbases$"
  ABS_auto_build_starbases_tt: "§BBasic function§!\nThis option is required for almost all options."
  ABS_need_auto_build_on_tt: '§R$TRIGGER_FAIL$§!Need to enable "ABS_auto_build_starbases_text"'

  ABS_auto_build_starbases_notice_text: "Notice"
  ABS_auto_build_starbases_notice_tt: "§BSub-option§! of $ABS_auto_build_starbases_text$\nIf enabled, the above function will trigger an event to ask whether to perform the operation."

  ABS_auto_build_starbases_fallen_text: "$personality_fallen_empire_xenophobe$"
  ABS_auto_build_starbases_fallen_tt: "§BSub-option§! of $ABS_auto_build_starbases_text$\nIf enabled, avoid enraging $personality_fallen_empire_xenophobe$ when $ABS_auto_build_starbases_text$."

  ABS_auto_build_starbases_stations_text: "$AUTO_GENERATED_STANDARD$ $BUILD$ $stations$"
  ABS_auto_build_starbases_stations_tt: "§BSub-option§! of $ABS_auto_build_starbases_text$\nIf enabled, $ABS_auto_build_starbases_stations_text$ in the same system after completing a $starbases$."

  ABS_auto_build_starbases_subject_text: "$subjects$"
  ABS_auto_build_starbases_subject_tt: "§BSub-option§! of $ABS_auto_build_starbases_text$\nIf enabled, Allows $ABS_auto_build_starbases_text$ when a §Yeligible $subjects$§! completes the survey of a system."
  ABS_auto_build_starbases_subject_always_text: "§G$ALWAYS$§!"
  ABS_auto_build_starbases_subject_always_tt: "Default Option\nIf you select this option, $ABS_auto_build_starbases_text$ will always triggered when a §Y$subjects$§! completes the survey of a system."
  ABS_auto_build_starbases_subject_limited_text: "§YSlightly Limited§!"
  ABS_auto_build_starbases_subject_limited_tt: "Suitable for players who need some sense of engagement.\nIf you select this option, $ABS_auto_build_starbases_text$ will only triggered when the §Y$subjects$§! has §Y$subject_cannot_expand$§!, or has §Y$subject_can_expand_with_tithe$§!, or §G$LOYALTY$ >= 50§!."
  ABS_auto_build_starbases_subject_never_text: "§RSeverely Limited§!"
  ABS_auto_build_starbases_subject_never_tt: "Suitable for players who want to overcome some difficulties.\nIf you select this option, $ABS_auto_build_starbases_text$ will only triggered when the §Y$subjects$§! has §Y$subject_cannot_expand$§!, or has §Y$subject_can_expand_with_tithe$§!, §RAND§! §G$LOYALTY$ >= 80§!."

