  ### 1.2 GUI ###

  ABS_resource_title: "建材清单"
  ABS_resource_tt: "这些数字反映了自动建造所需求的资源。在正常情况下，所有数值应当为0；只有在库存不足时才会增加这些数字。\n若库存资源充裕，下一次触发自动建造时将一并支付。\n点击对应按钮以手动支付账单。"
  ABS_pay_all_text: "全部支付"
  ABS_minerals_text: "£minerals£$minerals$: [root.ABS_minerals]"
  ABS_alloys_text: "£alloys£$alloys$: [root.ABS_alloys]"
  ABS_influence_text: "£influence£$influence$: [root.ABS_influence]"

  ABS_action_title: "行动列表"
  ABS_action_tt: "行动列表中的按钮可以执行一些即时效果。部分§B行动§!可以通过按钮下方的§B子选项§!来配置。"
  ABS_build_starbases_text: "$BUILD$$starbases$"
  ABS_build_starbases_tt: "§B行动§!\n在$SURVEYED$$SYSTEMS$$BUILD$$starbases$。\n有§B子选项§!!"
  ABS_build_starbases_subject_text: "$subjects$"
  ABS_build_starbases_subject_tt: "$ABS_build_starbases_text$的§B子选项§!\n若启用，则允许在§Y$subjects$§!$SURVEYED$$SYSTEMS$$ABS_build_starbases_text$。"
  ABS_build_starbases_fallen_text: "$personality_fallen_empire_xenophobe$"
  ABS_build_starbases_fallen_tt: "$ABS_build_starbases_text$的§B子选项§!\n若启用，则$ABS_build_starbases_text$时避免激怒$personality_fallen_empire_xenophobe$。"
  ABS_build_stations_text: "$BUILD$$stations$"
  ABS_build_stations_tt: "§B行动§!\n在控制的$SYSTEMS$$BUILD$$station_gatherers$和$station_researchers$。"

  ABS_auto_build_starbases_text: "$AUTO_GENERATED_STANDARD$$BUILD$$starbases$"
  ABS_auto_build_starbases_tt: "§B基本功能§!\n几乎所有选项都需要启用该选项。"
  ABS_need_auto_build_on_tt: "§R$TRIGGER_FAIL$§!需要启用ABS_auto_build_starbases_text"

  ABS_auto_build_starbases_notice_text: "通知"
  ABS_auto_build_starbases_notice_tt: "$ABS_auto_build_starbases_text$的§B子选项§!\n若启用，将会触发一个事件来询问是否执行操作。"

  ABS_auto_build_starbases_fallen_text: "$personality_fallen_empire_xenophobe$"
  ABS_auto_build_starbases_fallen_tt: "$ABS_auto_build_starbases_text$的§B子选项§!\n若启用，则$ABS_auto_build_starbases_text$时避免激怒$personality_fallen_empire_xenophobe$。"

  ABS_auto_build_starbases_stations_text: "$AUTO_GENERATED_STANDARD$$BUILD$$stations$"
  ABS_auto_build_starbases_stations_tt: "$ABS_auto_build_starbases_text$的§B子选项§!\n若启用，则$ABS_auto_build_starbases_text$的同时$ABS_auto_build_starbases_stations_text$。"

  ABS_auto_build_starbases_subject_text: "$subjects$"
  ABS_auto_build_starbases_subject_tt: "$ABS_auto_build_starbases_text$的§B子选项§!\n若启用，则允许在§Y符合条件的$subjects$§!完成调查时$ABS_auto_build_starbases_text$。"
  ABS_auto_build_starbases_subject_always_text: "§G$ALWAYS$§!"
  ABS_auto_build_starbases_subject_always_tt: "默认选项\n若选择此选项，则玩家总是可以在§Y$subjects$§!完成对$SYSTEM$的调查时触发$ABS_auto_build_starbases_text$。"
  ABS_auto_build_starbases_subject_limited_text: "§Y轻微受限§!"
  ABS_auto_build_starbases_subject_limited_tt: "适合追求代入感的玩家。\n若选择此选项，则只有在§Y$subjects$§!有§Y$subject_cannot_expand$§!，或§Y$subject_can_expand_with_tithe$§!，或§G$LOYALTY$ >= 50§!时，才触发$ABS_auto_build_starbases_text$。"
  ABS_auto_build_starbases_subject_never_text: "§R严重受限§!"
  ABS_auto_build_starbases_subject_never_tt: "适合想挑战自己的玩家。\n若选择此选项，则只有在§Y$subjects$§!有§Y$subject_cannot_expand$§!，或§Y$subject_can_expand_with_tithe$§!，并且§G$LOYALTY$ >= 80§!时，才触发$ABS_auto_build_starbases_text$。"

