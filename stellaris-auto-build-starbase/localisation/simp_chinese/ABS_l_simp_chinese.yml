  ABS_rare_crystals_text: "£rare_crystals£$rare_crystals$: [root.ABS_rare_crystals]"
  ABS_build_hyper_relays_text: "$BUILD$$hyper_relay$"
  ABS_build_hyper_relays_tt: "§B行动§!\n在控制的$SYSTEMS$$BUILD$$hyper_relay$。\n有§B子选项§!!"
  ABS_build_hyper_relays_subject_text: "$subjects$"
  ABS_build_hyper_relays_subject_tt: "$ABS_build_hyper_relays_text$的§B子选项§!\n若启用，则允许在§Y$subjects$§!控制的$SYSTEMS$$ABS_build_hyper_relays_text$。"

  ABS_auto_build_starbases_neighbor_text: "边境扩张"
  ABS_auto_build_starbases_neighbor_tt: "$ABS_auto_build_starbases_text$的§B子选项§!\n若启用，则只在相邻的$SYSTEM$$ABS_auto_build_starbases_stations_text$。"
  ABS_build_starbases_neighbor_text: "边境扩张"
  ABS_build_starbases_neighbor_tt: "$ABS_build_starbases_text$的§B子选项§!\n若启用，则只在相邻$SYSTEM$$ABS_build_starbases_text$。"

  ### 1.2.2 ###

  ABS_build_starbases_with_stations_text: "$stations$"
  ABS_build_starbases_with_stations_tt: "$ABS_build_starbases_text$的§B子选项§!\n若启用，则在$ABS_build_starbases_text$同时$ABS_build_stations_text$。"

